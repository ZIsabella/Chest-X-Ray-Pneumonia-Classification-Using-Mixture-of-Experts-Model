services:
  backend:
    build:
      context: ./backend
    ports:
      - "18000:8000"
    environment:
      WEIGHTS_PATH: /app/weights
      CXR_MOE_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./weights:/app/weights

  frontend:
    image: nginx:alpine
    ports:
      - "13000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
